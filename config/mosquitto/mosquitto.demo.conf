# FallHelp — Demo Mosquitto config (no auth)
# MQTT for backend-api / ESP32, WebSocket for apps/device-simulator.
# The WebSocket listener is bound to localhost so only this machine can publish through it.
# Run: mosquitto -c config/mosquitto/mosquitto.demo.conf -v

listener 1883 0.0.0.0
allow_anonymous true

listener 9001 127.0.0.1
protocol websockets

log_type error
log_type warning
log_type notice
log_type information
