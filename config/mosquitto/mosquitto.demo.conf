# FallHelp — Demo Mosquitto config (no auth)
# MQTT (1884) for backend-api, WebSocket (9001) for apps/device-simulator.
# Uses 1884 instead of 1883 so it runs alongside the Windows 'mosquitto' service.
# Both listeners are bound to localhost so nobody on the venue Wi-Fi can publish fake events.
# To use a real ESP32 together with the demo, change the first listener to 0.0.0.0
# and point the firmware MQTT port at 1884.
# Run: mosquitto -c config/mosquitto/mosquitto.demo.conf -v

listener 1884 127.0.0.1
allow_anonymous true

listener 9001 127.0.0.1
protocol websockets

log_type error
log_type warning
log_type notice
log_type information
